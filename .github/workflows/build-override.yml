name: Build Override - Client & Server

on:
  push:
    branches:
      - main
      - testing

jobs:
  build:
    runs-on: self-hosted

    env:
      PROJECT_NAME: Override
      UE_ENGINE_PATH: D:\Work\Repo\UnrealEngine
      BUILD_SCRIPT: D:\Work\Repo\Override-Repo\Override\Override\Tchoupi_Builder.bat
      VERSION_UPDATE_SCRIPT: D:\Work\Repo\Override-Repo\Override\Override\Tchoupi_Updater.ps1
      OUTPUT_DIR: D:\Work\Build\Override\Build
      ZIP_OUTPUT: D:\Work\Build\Override\Zip
      
    steps:
      - name: Set start time
        shell: pwsh
        run: |
          $start = Get-Date
          echo "BUILD_START=$($start.ToUniversalTime().ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Append
        
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unreal DerivedDataCache
        uses: actions/cache@v4
        with:
          path: |
            D:\Work\Repo\Override-Repo\Override\Override\Saved\DerivedDataCache
          key: ${{ runner.os }}-ddc-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-ddc-

      - name: Update Versioning
        shell: pwsh
        run: |
          & $env:VERSION_UPDATE_SCRIPT
          
      - name: Build Client (Iterate)
        run: |
          call "${{ env.BUILD_SCRIPT }}" client iterate ${{ env.FULL_VERSION }}
        shell: cmd

      - name: Build Server (Full)
        run: |
          call "${{ env.BUILD_SCRIPT }}" server full
        shell: cmd

#      - name: Create ZIP archives
#        shell: cmd
#        run: |
#          if not exist "${{ env.ZIP_OUTPUT }}" mkdir "${{ env.ZIP_OUTPUT }}"
#          for /d %%D in ("${{ env.OUTPUT_DIR }}\*") do (
#            "C:\Program Files\7-Zip\7z.exe" a -tzip "${{ env.ZIP_OUTPUT }}\%%~nD.zip" "%%D\*" -mx=1 -mmt=on
#            echo Zipped: %%~nD
#          )

#      - name: Upload Build Artifacts
#        uses: actions/upload-artifact@v4
#        with:
#          name: Override-${{ env.FULL_VERSION }}
#          path: ${{ env.ZIP_OUTPUT }}

      - name: Send Discord Notification
        if: always()
        shell: pwsh
        run: |
          $startTime = [DateTime]::Parse($env:BUILD_START)
          $endTime = Get-Date
          $duration = $endTime - $startTime
          $durationFormatted = "{0:D2}h:{1:D2}m:{2:D2}s" -f $duration.Hours, $duration.Minutes, $duration.Seconds
          
          $status = '${{ job.status }}'
          $color = 0x00ff00
          if ($status -eq 'failure') { $color = 0xff0000 }
          elseif ($status -eq 'cancelled') { $color = 0x808080 }
          
          $payload = @{
            embeds = @(@{
              title = '${{ github.workflow }}'
              description = "Build terminé avec le statut **$status**"
              color = $color
              fields = @(
                @{ name = 'Branch'; value = '${{ github.ref_name }}' }
                @{ name = 'Version'; value = "$($env:FULL_VERSION)" },
                @{ name = 'Durée'; value = "$durationFormatted" },
                @{ name = 'Logs'; value = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
              )
            })
          } | ConvertTo-Json -Depth 5
          
          Invoke-RestMethod -Uri '${{ secrets.DISCORD_TCHOUPI_NOTIFIER }}' -Method Post -ContentType 'application/json' -Body $payload