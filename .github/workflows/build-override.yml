name: Build Override - Client & Server

on:
  push:
    branches:
      - main
      - testing

jobs:
  build:
    runs-on: self-hosted

    env:
      PROJECT_NAME: Override
      PROJECT_PATH: C:\actions-runner\_work\Override\Override\Override
      UE_ENGINE_PATH: C:\partage\Tchoupi Source Light\UnrealEngine
      BUILD_SCRIPT: C:\Users\SIG5-PROJ05\Desktop\Tchoupi_Tools\Tchoupi_Builder.bat
      VERSION_UPDATE_SCRIPT: C:\Users\SIG5-PROJ05\Desktop\Tchoupi_Tools\Tchoupi_Updater.ps1
      BUILD_UPLOADER_SCRIPT: C:\Users\SIG5-PROJ05\Desktop\Tchoupi_Tools\Tchoupi_Cloud_Uploader.ps1
      OUTPUT_DIR: C:\Users\SIG5-PROJ05\Desktop\Build_Archive\Server\Win64
      SERCER_BUILD_OUTPUT: C:\Users\SIG5-PROJ05\Desktop\
      DOTNET_DISABLE_VULNERABILITY_ANALYSIS: true
    
    steps:
      - name: Set start time
        shell: pwsh
        run: |
          $start = Get-Date
          echo "BUILD_START=$($start.ToUniversalTime().ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: false

      - name: Cache Unreal DerivedDataCache
        uses: actions/cache@v4
        with:
          path: |
            C:\actions-runner\_work\Override\Override\Override\Saved\DerivedDataCache
          key: ${{ runner.os }}-ddc-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-ddc-

      - name: Cache Binaries
        uses: actions/cache@v4
        with:
          path: |
            C:\actions-runner\_work\Override\Override\Override\Binaries
            C:\actions-runner\_work\Override\Override\Override\Intermediate
          key: ${{ runner.os }}-binaries-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-binaries-

      - name: Update Versioning
        shell: pwsh
        run: |
          & $env:VERSION_UPDATE_SCRIPT

      - name: Build Editor
        shell: cmd
        run: |
          call "${{ env.UE_ENGINE_PATH }}\Engine\Binaries\DotNET\UnrealBuildTool\UnrealBuildTool.exe" OverrideEditor Win64 Development -Project="${{ env.PROJECT_PATH }}\${{ env.PROJECT_NAME }}.uproject"

      - name: Build & Zip Client (Iterate)
        run: |
          call "${{ env.BUILD_SCRIPT }}" client iterate ${{ env.FULL_VERSION }}
        shell: cmd

      - name: Build Server (Full)
        run: |
          call "${{ env.BUILD_SCRIPT }}" server full ${{ env.FULL_VERSION }}
        shell: cmd
        
      - name: Upload Client Build In Cloud
        shell: pwsh
        run: |
          & $env:BUILD_UPLOADER_SCRIPT

      - name: Send Discord Notification
        if: always()
        shell: pwsh
        run: |
          $startTime = [DateTime]::Parse($env:BUILD_START)
          $endTime = Get-Date
          $duration = $endTime - $startTime
          $durationFormatted = "{0:D2}h:{1:D2}m:{2:D2}s" -f $duration.Hours, $duration.Minutes, $duration.Seconds
          
          $status = '${{ job.status }}'
          $color = 0x00ff00
          if ($status -eq 'failure') { $color = 0xff0000 }
          elseif ($status -eq 'cancelled') { $color = 0x808080 }
          
          $payload = @{
            embeds = @(@{
              title = '${{ github.workflow }}'
              description = "Build terminé avec le statut **$status**"
              color = $color
              fields = @(
                @{ name = 'Branch'; value = '${{ github.ref_name }}' }
                @{ name = 'Version'; value = "$($env:FULL_VERSION)" },
                @{ name = 'Durée'; value = "$durationFormatted" },
                @{ name = 'Logs'; value = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
              )
            })
          } | ConvertTo-Json -Depth 5
          
          Invoke-RestMethod -Uri '${{ secrets.DISCORD_TCHOUPI_NOTIFIER }}' -Method Post -ContentType 'application/json' -Body $payload